<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#961996">
    <title>Vactrinova Server | Staff</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face { font-family: 'Pixcon'; src: url('pixcon.ttf') format('truetype'); }
        :root { --purple-face: #961996; --purple-border: #5e0f5e; --bg-dark: #1c1c1c; --bg-darker: #111111; --text-white: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Pixcon', monospace; padding-top: 80px; font-size: 14px; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 2rem; background-color: var(--purple-face); border-bottom: 3px solid var(--purple-border); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .nav-logo img { height: 40px; width: auto; image-rendering: pixelated; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { text-transform: uppercase; font-size: 0.9rem; padding: 5px 10px; border-radius: 4px; }
        .nav-links a:hover { background-color: rgba(0,0,0,0.2); }
        .nav-links a.active { background-color: var(--purple-border); color: #fff; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        
        .main-container { padding: 2rem; max-width: 900px; margin: 0 auto; min-height: 80vh; text-align: center; }
        .page-title { font-size: 2rem; color: var(--purple-face); border-bottom: 2px solid var(--purple-border); display: inline-block; margin-bottom: 2rem; }
        .text-content { background: var(--bg-darker); padding: 2rem; border: 2px solid #333; text-align: left; }

        @media (max-width: 600px) { .navbar { flex-direction: column; padding: 1rem; gap: 1rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo"><img src="logo.png" alt="Logo"></div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="rangos.html">Rangos</a></li>
            <li><a href="staff.html" class="active">Staff</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <h1 class="page-title">NUESTRO EQUIPO (STAFF)</h1>
        <div class="text-content">
            <p>Conoce a los administradores y moderadores.</p>
            <br>
            <p>Admin: VactricaKing</p>
        </div>
    </div>
</body>
</html>
