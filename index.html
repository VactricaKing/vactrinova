<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#961996">
    <title>Vactrinova - Inicio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face { font-family: 'Pixcon'; src: url('pixcon.ttf') format('truetype'); }
        :root { --purple-face: #961996; --purple-border: #5e0f5e; --bg-dark: #1c1c1c; --bg-darker: #111111; --text-white: #e0e0e0; --minecraft-green: #3b8526; --minecraft-shadow: #1e4213; --status-online: #4CAF50; --status-offline: #ff5555; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* PADDING CORREGIDO: Fondo cubre todo, pero sin forzar estiramientos */
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Pixcon', monospace; font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }

        /* NAVBAR */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: var(--purple-face); border-bottom: 4px solid var(--purple-border); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); min-height: 80px; }
        .nav-logo img { height: 45px; width: auto; image-rendering: pixelated; }
        .nav-links { display: flex; gap: 1rem; list-style: none; }
        .nav-links a { text-transform: uppercase; font-size: 0.9rem; padding: 8px 12px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .nav-links a:hover { background-color: rgba(0,0,0,0.2); }
        .nav-links a.active { background-color: var(--purple-border); color: #fff; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); border: 2px solid #7a1e7a; }

        /* CONTENEDOR PRINCIPAL (Igual estructura que los otros) */
        .main-container { 
            padding: 140px 1rem 2rem 1rem; 
            width: 100%; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
        }

        .page-title { 
            font-size: 2.5rem; 
            margin-bottom: 2rem; 
            text-transform: uppercase; 
            text-shadow: 4px 4px 0px #000; 
            line-height: 1.2; 
        }
        
        /* WIDGET CORREGIDO: FONDO SÓLIDO Y TAMAÑO CONTROLADO */
        .server-widget { 
            background-color: var(--bg-darker); /* FONDO GRIS SÓLIDO IGUAL QUE STAFF/RANGOS */
            border: 4px solid var(--purple-border); 
            padding: 30px; 
            width: 100%; 
            max-width: 600px; /* Ancho cómodo, no gigante */
            box-shadow: 0 8px 0 #111; /* Sombra sólida igual que los otros */
            margin: 0 auto;
        }

        .server-status-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 6px; width: fit-content; margin-left: auto; margin-right: auto; border: 1px solid #444; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #555; display: block; }
        .status-text { font-size: 1rem; font-weight: bold; line-height: 1; margin-top: 2px; white-space: nowrap; }
        .status-online .status-dot { background: var(--status-online); box-shadow: 0 0 8px var(--status-online); }
        .status-online .status-text { color: var(--status-online); }
        .status-offline .status-dot { background: var(--status-offline); box-shadow: 0 0 8px var(--status-offline); }
        .status-offline .status-text { color: var(--status-offline); }

        .bedrock-btn { 
            display: block; width: 100%; background: var(--minecraft-green); color: white; padding: 15px; 
            font-weight: bold; text-transform: uppercase; font-size: 1.1rem;
            border: 4px solid var(--minecraft-shadow); border-top-color: #5cb842; border-left-color: #5cb842; 
            box-shadow: 0 6px 0 #152e0d; text-shadow: 2px 2px 0 #1e4213; margin-bottom: 20px; position: relative; top: 0; transition: 0.1s;
            white-space: nowrap;
        }
        .bedrock-btn:active { top: 6px; box-shadow: 0 0 0 #152e0d; }

        .ip-box-container { background: #080808; border: 2px dashed #666; padding: 15px; cursor: pointer; transition: 0.2s; }
        .ip-box-container:active { background: #222; transform: scale(0.98); }
        
        /* IP TEXTO NORMAL EN PC */
        .ip-text { font-family: monospace; font-size: 1.2rem; white-space: nowrap; color: #fff; }

        footer { padding: 2rem; text-align: center; background-color: black; color: #a0a0a0; font-size: 0.7rem; width: 100%; }

        @media (max-width: 600px) {
            .navbar { flex-direction: column; padding: 0.8rem; gap: 0.5rem; justify-content: center; min-height: auto; }
            .nav-logo img { height: 40px; }
            .nav-links { width: 100%; justify-content: center; gap: 5px; }
            .nav-links a { font-size: 0.7rem; padding: 6px 8px; }

            .main-container { padding-top: 160px; }
            .page-title { font-size: 1.8rem; margin-bottom: 1.5rem; }
            
            .server-widget { padding: 20px; }
            .bedrock-btn { font-size: 0.9rem; padding: 12px; }
            
            /* AQUÍ ESTÁ EL TRUCO: LETRA PEQUEÑA SOLO EN MÓVIL */
            .ip-text { font-size: 0.75rem; } 
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo"><img src="logo.png" alt="Logo"></div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="rangos.html">Rangos</a></li>
            <li><a href="staff.html">Staff</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <h1 class="page-title">Bienvenido a<br>Vactrinova</h1>
        
        <div class="server-widget">
            <p style="font-size: 1rem; color:#ccc; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">Versión 1.21.11</p>
            
            <div id="statusContainer" class="server-status-container status-offline">
                <div class="status-dot"></div>
                <div id="statusText" class="status-text">Cargando...</div>
            </div>

            <a href="minecraft://?addExternalServer=Vactrinova|play.vactrinova.dpdns.org:23783" class="bedrock-btn">
                ABRIR EN BEDROCK
            </a>

            <div class="ip-box-container" onclick="copiarIP()">
                <div class="ip-text">play.vactrinova.dpdns.org</div>
            </div>
            <div id="copyFeedback" style="color:#aaa; font-size:0.8rem; margin-top:8px;">Toca para copiar</div>
        </div>
    </div>

    <footer><p>© 2025 Vactrinova Network.</p></footer>

    <script>
        function copiarIP(){navigator.clipboard.writeText("play.vactrinova.dpdns.org").then(()=>{document.getElementById("copyFeedback").innerText="¡Copiado!"; setTimeout(()=>{document.getElementById("copyFeedback").innerText="Toca para copiar"},2000)})}
        fetch('https://api.mcsrvstat.us/2/play.vactrinova.dpdns.org').then(r=>r.json()).then(d=>{
            let s=document.getElementById('statusContainer'),t=document.getElementById('statusText');
            if(d.online && !JSON.stringify(d.motd).toUpperCase().includes("OFFLINE")){s.className='server-status-container status-online';t.innerText='ONLINE'}
            else{s.className='server-status-container status-offline';t.innerText='OFFLINE'}
        });
    </script>
</body>
</html>
