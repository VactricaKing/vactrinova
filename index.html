<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#961996">
    <title>Vactrinova Server | Inicio</title> <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* --- ESTILOS BASE (Mismos que el index) --- */
        @font-face { font-family: 'Pixcon'; src: url('pixcon.ttf') format('truetype'); }
        :root {
            --purple-face: #961996; --purple-border: #5e0f5e; --purple-shadow: #2e052e;
            --bg-dark: #1c1c1c; --bg-darker: #111111; --text-white: #e0e0e0; --text-gray: #a0a0a0;
            --minecraft-green: #3b8526; --minecraft-green-shadow: #1e4213;
            --status-online: #4CAF50; --status-offline: #ff5555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Pixcon', monospace; line-height: 1.6; font-size: 14px; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* NAVBAR */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 2rem; background-color: var(--purple-face); border-bottom: 3px solid var(--purple-border); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .nav-logo img { height: 40px; width: auto; display: block; image-rendering: pixelated; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a { text-transform: uppercase; font-size: 0.9rem; padding: 5px 10px; border-radius: 4px; }
        .nav-links a:hover { background-color: rgba(0,0,0,0.2); color: #fff; }
        .nav-links a.active { background-color: var(--purple-border); color: #fff; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), #2a2a2a;
        }

        /* WIDGET DEL SERVIDOR (Pequeño y funcional) */
        .mini-widget {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--purple-border);
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 3rem; /* Separación del contenido */
            text-align: center;
        }

        .server-status-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; padding: 5px; background-color: rgba(0, 0, 0, 0.3); border-radius: 4px; width: fit-content; margin-left: auto; margin-right: auto; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #555; }
        .status-text { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .status-online .status-dot { background-color: var(--status-online); box-shadow: 0 0 8px var(--status-online); }
        .status-online .status-text { color: var(--status-online); }
        .status-offline .status-dot { background-color: var(--status-offline); box-shadow: 0 0 8px var(--status-offline); }
        .status-offline .status-text { color: var(--status-offline); }

        .bedrock-btn { display: block; width: 100%; background-color: var(--minecraft-green); color: white; padding: 10px; text-transform: uppercase; font-weight: bold; border: 2px solid var(--minecraft-green-shadow); border-top-color: #5cb842; border-left-color: #5cb842; box-shadow: 0 4px 0 #152e0d; text-shadow: 1px 1px 0px #1e4213; margin-bottom: 10px; font-size: 0.8rem; }
        .bedrock-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        .ip-box-container { background-color: #000; border: 1px dashed var(--text-gray); padding: 8px; cursor: pointer; display: flex; justify-content: center; overflow: hidden; }
        .ip-text { font-family: monospace; color: #fff; font-size: 0.9rem; }
        .copy-feedback { font-size: 0.7rem; color: var(--text-gray); margin-top: 5px; height: 15px; }

        /* AREA DE CONTENIDO (Donde escribirás) */
        .content-area {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-darker);
            border: 2px solid #333;
            padding: 2rem;
            text-align: left;
        }

        .page-title {
            color: var(--purple-face);
            font-size: 2rem;
            border-bottom: 3px solid var(--purple-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }

        footer { padding: 2rem; text-align: center; background-color: black; color: var(--text-gray); font-size: 0.7rem; }
        @media (max-width: 600px) { .navbar { flex-direction: column; padding: 1rem; gap: 1rem; } .nav-logo img { height: 45px; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <img src="logo.png" alt="Vactrinova Server">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="rangos.html">Rangos</a></li>
            <li><a href="staff.html">Staff</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <div class="main-container">
        
        <div class="mini-widget">
            <div id="statusContainer" class="server-status-container status-offline">
                <div class="status-dot"></div>
                <div id="statusText" class="status-text">Cargando...</div>
            </div>

            <a href="minecraft://?addExternalServer=Vactrinova|play.vactrinova.dpdns.org:23783" class="bedrock-btn">
                   Abrir en Bedrock
            </a>

            <div class="ip-box-container" onclick="copiarIP()">
                <div class="ip-text">play.vactrinova.dpdns.org</div>
            </div>
            <div class="copy-feedback" id="copyFeedback">Click para copiar IP</div>
        </div>

        <div class="content-area">
            <h1 class="page-title">TITULO DE LA PAGINA</h1>
            
            <p>Aquí puedes escribir el texto, poner imágenes o lo que necesites para esta sección.</p>
            <br>
            <p>Borra esto y pon tu información.</p>
        </div>

    </div>

    <footer>
        <p>© 2025 Vactrinova Server.</p>
    </footer>

    <script>
        function copiarIP() {
            const ip = "play.vactrinova.dpdns.org";
            const feedback = document.getElementById("copyFeedback");
            const box = document.querySelector(".ip-box-container");
            navigator.clipboard.writeText(ip).then(function() { showSuccess(feedback, box); }, function() { fallbackCopy(ip, feedback, box); });
        }
        function fallbackCopy(text, feedbackElement, boxElement) {
            var textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); showSuccess(feedbackElement, boxElement); } catch (err) { feedbackElement.innerText = "Error"; }
            document.body.removeChild(textArea);
        }
        function showSuccess(element, box) {
            element.innerText = "¡Copiado!"; element.style.color = "#4CAF50"; box.style.borderColor = "#4CAF50"; 
            setTimeout(() => { element.innerText = "Click para copiar IP"; element.style.color = "#a0a0a0"; box.style.borderColor = "#a0a0a0"; }, 2500);
        }
        function checkServerStatus() {
            const statusContainer = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');
            fetch('https://api.mcsrvstat.us/2/play.vactrinova.dpdns.org').then(response => response.json()).then(data => {
                let isOnline = data.online;
                if (isOnline && data.motd && data.motd.clean) {
                    const motdString = data.motd.clean.join(" ").toUpperCase();
                    if (motdString.includes("OFFLINE") || motdString.includes("FALIXNODES")) { isOnline = false; }
                }
                if (isOnline) { statusContainer.className = 'server-status-container status-online'; statusText.innerText = 'ONLINE'; }
                else { statusContainer.className = 'server-status-container status-offline'; statusText.innerText = 'OFFLINE'; }
            }).catch(error => { statusContainer.className = 'server-status-container status-offline'; statusText.innerText = 'OFFLINE'; });
        }
        window.onload = checkServerStatus;
    </script>
</body>
</html>
