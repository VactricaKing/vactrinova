<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#961996">
    <title>Vactrinova - Inicio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face { font-family: 'Pixcon'; src: url('pixcon.ttf') format('truetype'); }
        :root { --purple-face: #961996; --purple-border: #5e0f5e; --purple-shadow: #2e052e; --bg-dark: #1c1c1c; --bg-darker: #111111; --text-white: #e0e0e0; --minecraft-green: #3b8526; --minecraft-shadow: #1e4213; --status-online: #4CAF50; --status-offline: #ff5555; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* ESPACIO SUPERIOR PARA BARRA FIJA */
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Pixcon', monospace; padding-top: 120px; font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }

        /* NAVBAR FIJA */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 2rem; background-color: var(--purple-face); border-bottom: 4px solid var(--purple-border); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .nav-logo img { height: 40px; width: auto; image-rendering: pixelated; }
        .nav-links { display: flex; gap: 1rem; list-style: none; }
        .nav-links a { text-transform: uppercase; font-size: 0.9rem; padding: 8px 12px; border-radius: 4px; font-weight: bold; }
        .nav-links a:hover { background-color: rgba(0,0,0,0.2); }
        .nav-links a.active { background-color: var(--purple-border); color: #fff; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); border: 2px solid #7a1e7a; }

        /* HERO & WIDGET */
        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), #2a2a2a; padding: 2rem 1rem; margin-top: -20px; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; text-transform: uppercase; text-shadow: 4px 4px 0px #000; line-height: 1.2; }
        .server-widget { background-color: rgba(0,0,0,0.7); border: 4px solid var(--purple-border); padding: 25px; width: 100%; max-width: 450px; margin: 2rem 0; box-shadow: 0 0 25px rgba(150, 25, 150, 0.15); }

        /* FOCO ALINEADO */
        .server-status-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 6px; width: fit-content; margin-left: auto; margin-right: auto; border: 1px solid #444; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #555; display: block; }
        .status-text { font-size: 0.9rem; font-weight: bold; line-height: 1; margin-top: 2px; }
        .status-online .status-dot { background: var(--status-online); box-shadow: 0 0 8px var(--status-online); }
        .status-online .status-text { color: var(--status-online); }
        .status-offline .status-dot { background: var(--status-offline); box-shadow: 0 0 8px var(--status-offline); }
        .status-offline .status-text { color: var(--status-offline); }

        /* BOTÓN 3D BEDROCK */
        .bedrock-btn { 
            display: block; width: 100%; background: var(--minecraft-green); color: white; padding: 15px; 
            font-weight: bold; text-transform: uppercase; font-size: 1rem;
            border: 4px solid var(--minecraft-shadow);
            border-top-color: #5cb842; border-left-color: #5cb842; 
            box-shadow: 0 6px 0 #152e0d; /* Sombra sólida */
            text-shadow: 2px 2px 0 #1e4213; margin-bottom: 20px; position: relative; top: 0; transition: 0.1s;
        }
        .bedrock-btn:active { top: 6px; box-shadow: 0 0 0 #152e0d; } /* Efecto hundir */

        /* CAJA IP */
        .ip-box-container { background: #080808; border: 2px dashed #666; padding: 15px; cursor: pointer; transition: 0.2s; }
        .ip-box-container:active { background: #222; transform: scale(0.98); }
        .ip-text { font-family: monospace; font-size: 1.1rem; word-break: break-all; color: #fff; }

        footer { padding: 2rem; text-align: center; background-color: black; color: var(--text-gray); font-size: 0.7rem; margin-top: auto; }

        @media (max-width: 600px) {
            .navbar { flex-direction: column; padding: 1rem; gap: 0.8rem; }
            .hero h1 { font-size: 1.8rem; }
            .ip-text { font-size: 0.9rem; }
            body { padding-top: 140px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo"><img src="logo.png" alt="Logo"></div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="rangos.html">Rangos</a></li>
            <li><a href="staff.html">Staff</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Bienvenido a<br>Vactrinova</h1>
        
        <div class="server-widget">
            <p style="font-size: 0.9rem; color:#ccc; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Versión 1.21.11</p>
            
            <div id="statusContainer" class="server-status-container status-offline">
                <div class="status-dot"></div>
                <div id="statusText" class="status-text">Cargando...</div>
            </div>

            <a href="minecraft://?addExternalServer=Vactrinova|play.vactrinova.dpdns.org:23783" class="bedrock-btn">
                ABRIR EN BEDROCK
            </a>

            <div class="ip-box-container" onclick="copiarIP()">
                <div class="ip-text">play.vactrinova.dpdns.org</div>
            </div>
            <div id="copyFeedback" style="color:#aaa; font-size:0.8rem; margin-top:8px;">Toca para copiar</div>
        </div>
    </section>

    <footer><p>© 2025 Vactrinova Network.</p></footer>

    <script>
        function copiarIP(){navigator.clipboard.writeText("play.vactrinova.dpdns.org").then(()=>{document.getElementById("copyFeedback").innerText="¡Copiado!"; setTimeout(()=>{document.getElementById("copyFeedback").innerText="Toca para copiar"},2000)})}
        fetch('https://api.mcsrvstat.us/2/play.vactrinova.dpdns.org').then(r=>r.json()).then(d=>{
            let s=document.getElementById('statusContainer'),t=document.getElementById('statusText');
            if(d.online && !JSON.stringify(d.motd).toUpperCase().includes("OFFLINE")){s.className='server-status-container status-online';t.innerText='ONLINE'}
            else{s.className='server-status-container status-offline';t.innerText='OFFLINE'}
        });
    </script>
</body>
</html>
