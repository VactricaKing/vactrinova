<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#961996">
    <title>Vactrinova Server | Inicio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face { font-family: 'Pixcon'; src: url('pixcon.ttf') format('truetype'); }
        :root { --purple-face: #961996; --purple-border: #5e0f5e; --bg-dark: #1c1c1c; --bg-darker: #111111; --text-white: #e0e0e0; --minecraft-green: #3b8526; --status-online: #4CAF50; --status-offline: #ff5555; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Pixcon', monospace; padding-top: 80px; font-size: 14px; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        
        /* NAVBAR FIJA */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 2rem; background-color: var(--purple-face); border-bottom: 3px solid var(--purple-border); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .nav-logo img { height: 40px; width: auto; image-rendering: pixelated; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { text-transform: uppercase; font-size: 0.9rem; padding: 5px 10px; border-radius: 4px; }
        .nav-links a:hover { background-color: rgba(0,0,0,0.2); }
        .nav-links a.active { background-color: var(--purple-border); color: #fff; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }

        /* HERO & WIDGET */
        .hero { min-height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), #2a2a2a; padding: 2rem 1rem; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; text-transform: uppercase; text-shadow: 4px 4px 0px #000; }
        .server-widget { background-color: rgba(0,0,0,0.6); border: 3px solid var(--purple-border); padding: 15px; width: 100%; max-width: 450px; margin-bottom: 2rem; }
        .server-status-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; width: fit-content; margin: 0 auto 10px auto; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #555; }
        .status-online .status-dot { background: var(--status-online); box-shadow: 0 0 10px var(--status-online); }
        .status-offline .status-dot { background: var(--status-offline); box-shadow: 0 0 10px var(--status-offline); }
        .bedrock-btn { display: block; width: 100%; background: var(--minecraft-green); color: white; padding: 12px; font-weight: bold; border: 3px solid #1e4213; margin-bottom: 10px; }
        .ip-box-container { background: #000; border: 2px dashed #a0a0a0; padding: 12px; cursor: pointer; }
        .ip-text { font-family: monospace; font-size: 1.1rem; word-break: break-all; }
        
        /* PROYECTOS */
        .content-section { padding: 4rem 2rem; background: var(--bg-darker); text-align: center; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1000px; margin: 0 auto; }
        .grid-card { background: var(--bg-dark); border: 3px solid #333; padding: 2rem; }
        
        /* MÓVIL */
        @media (max-width: 600px) {
            .navbar { flex-direction: column; padding: 1rem; gap: 1rem; }
            .hero h1 { font-size: 1.8rem; }
            .ip-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo"><img src="logo.png" alt="Logo"></div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="rangos.html">Rangos</a></li>
            <li><a href="staff.html">Staff</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Bienvenido al<br>Universo Vactrica</h1>
        <div class="server-widget">
            <p style="font-size: 0.8rem; color:#fff;">Vactrinova 1.21.11</p>
            <div id="statusContainer" class="server-status-container status-offline">
                <div class="status-dot"></div><div id="statusText">Cargando...</div>
            </div>
            <a href="minecraft://?addExternalServer=Vactrinova|play.vactrinova.dpdns.org:23783" class="bedrock-btn">ABRIR EN BEDROCK</a>
            <div class="ip-box-container" onclick="copiarIP()"><div class="ip-text">play.vactrinova.dpdns.org</div></div>
            <div id="copyFeedback" style="color:#aaa; font-size:0.8rem;">Toca para copiar</div>
        </div>
        <a href="#proyectos" class="bedrock-btn" style="background:#961996; border-color:#5e0f5e;">VER PROYECTOS</a>
    </section>

    <section id="proyectos" class="content-section">
        <h2 style="font-size:2rem; margin-bottom:2rem; color:#961996;">MIS PROYECTOS</h2>
        <div class="grid-container">
            <div class="grid-card"><h3>Radiant Prisma</h3><p>Hero Shooter RPG en C.</p></div>
            <div class="grid-card"><h3>Pac-Man Maker</h3><p>Crea tus niveles.</p></div>
        </div>
    </section>

    <script>
        function copiarIP(){navigator.clipboard.writeText("play.vactrinova.dpdns.org").then(()=>{document.getElementById("copyFeedback").innerText="¡Copiado!"; setTimeout(()=>{document.getElementById("copyFeedback").innerText="Toca para copiar"},2000)})}
        fetch('https://api.mcsrvstat.us/2/play.vactrinova.dpdns.org').then(r=>r.json()).then(d=>{
            let s=document.getElementById('statusContainer'),t=document.getElementById('statusText');
            if(d.online && !JSON.stringify(d.motd).toUpperCase().includes("OFFLINE")){s.className='server-status-container status-online';t.innerText='ONLINE'}
            else{s.className='server-status-container status-offline';t.innerText='OFFLINE'}
        });
    </script>
</body>
</html>
